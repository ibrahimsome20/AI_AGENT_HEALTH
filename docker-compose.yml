services:
  redis:
    image: redis:7-alpine
    container_name: healtrip-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  server:
    build:
      context: ./server
    container_name: healtrip-server
    depends_on:
      - redis
    environment:
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:3000
      REDIS_URL: redis://redis:6379
      CONVERSATION_TTL_SECONDS: 21600
      LOG_LEVEL: info
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: gemma3:4b
    ports:
      - "4000:4000"

  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    container_name: healtrip-client
    depends_on:
      - server
    ports:
      - "3000:3000"

volumes:
  redis-data:
